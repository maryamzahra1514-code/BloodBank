```yaml
name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21 with JavaFX 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          java-package: jdk+fx

      - name: Build with Ant
        run: ant -noinput -buildfile build.xml
```
